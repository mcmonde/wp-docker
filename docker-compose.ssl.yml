# Publish HTTPS and switch port 80 to an ACME-aware redirect.
# Use ./enable-ssl.sh. It issues the certificate before this file is applied,
# so Nginx does not start with a missing certificate.
services:
  nginx:
    ports:
      - "443:443"
    volumes: !override
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d/http-redirect.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - letsencrypt_www:/var/www/letsencrypt
